apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-test
  namespace: k8s-agent-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop-test
  template:
    metadata:
      labels:
        app: crashloop-test
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command:
        - sh
        - -c
        - echo 'Service running'; sleep 3600
