apiVersion: v1
kind: Pod
metadata:
  name: invalid-startup-command
  namespace: k8s-agent-demo
  labels:
    app: invalid-startup-command
spec:
  containers:
  - name: app
    image: busybox:1.36
    command:
    - /bin/sh
    - -c
    - echo 'Service started'; sleep 3600
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 32Mi
