apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: k8s-agent-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: app
          image: nginx:1.27.0-alpine
          ports:
            - containerPort: 80
