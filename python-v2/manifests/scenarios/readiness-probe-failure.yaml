# Scenario 5: Readiness Probe Failure
# Intended Failure:
#   The Pod starts and the container process runs successfully (nginx on port 80),
#   but the configured HTTP readiness probe queries an endpoint (/healthz) that returns 404.
# Expected Kubernetes Evidence:
#   - Container status: Running (started=true, ready=false).
#   - Pod condition Ready: False (ContainersNotReady).
#   - Restart count: 0 (Readiness failures do not restart containers).
#   - Kubelet Warning Event: Reason="Unhealthy", Message="Readiness probe failed: HTTP probe failed with statuscode: 404".

apiVersion: v1
kind: Pod
metadata:
  name: readiness-probe-failure
  namespace: k8s-agent-demo
  labels:
    app: readiness-probe-failure
spec:
  containers:
    - name: app
      image: nginx:1.27
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /healthz
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 5
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "50m"
          memory: "32Mi"
