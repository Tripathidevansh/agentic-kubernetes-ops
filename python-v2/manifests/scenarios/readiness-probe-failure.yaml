apiVersion: v1
kind: Pod
metadata:
  name: readiness-probe-failure
  namespace: k8s-agent-demo
  labels:
    app: readiness-probe-failure
spec:
  containers:
  - name: app
    image: nginx:1.27
    ports:
    - containerPort: 80
    readinessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 2
      periodSeconds: 5
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 32Mi
