# Scenario 9: Unbound PersistentVolumeClaim
# Intended Failure:
#   The PVC requests a deliberately nonexistent StorageClass ('nonexistent-storage-class').
#   Because dynamic provisioning cannot find the provisioner, the PVC remains Pending.
#   Consequently, the Pod mounting this PVC cannot be scheduled.
# Expected Kubernetes Evidence:
#   - PVC phase: Pending.
#   - PVC Warning Event: Reason="ProvisioningFailed", Message="storageclass.storage.k8s.io \"nonexistent-storage-class\" not found".
#   - Pod phase: Pending.
#   - Pod Warning Event: Reason="FailedScheduling", Message includes "pod has unbound immediate PersistentVolumeClaims".

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unbound-pvc
  namespace: k8s-agent-demo
  labels:
    app: unbound-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nonexistent-storage-class
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: unbound-pvc-pod
  namespace: k8s-agent-demo
  labels:
    app: unbound-pvc
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: storage-volume
          mountPath: /data
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "50m"
          memory: "32Mi"
  volumes:
    - name: storage-volume
      persistentVolumeClaim:
        claimName: unbound-pvc
