apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unbound-pvc
  namespace: k8s-agent-demo
  labels:
    app: unbound-pvc
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: unbound-pvc-pod
  namespace: k8s-agent-demo
  labels:
    app: unbound-pvc
spec:
  containers:
  - name: app
    image: busybox:1.36
    command:
    - sh
    - -c
    - sleep 3600
    volumeMounts:
    - name: storage-volume
      mountPath: /data
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 32Mi
  volumes:
  - name: storage-volume
    persistentVolumeClaim:
      claimName: unbound-pvc
