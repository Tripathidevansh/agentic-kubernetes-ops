apiVersion: v1
kind: Pod
metadata:
  name: missing-configmap
  namespace: k8s-agent-demo
  labels:
    app: missing-configmap
spec:
  containers:
  - name: app
    image: busybox:1.36
    command:
    - sh
    - -c
    - 'echo Config: $APP_CONFIG; sleep 3600'
    env:
    - name: APP_CONFIG
      valueFrom:
        configMapKeyRef:
          name: nonexistent-configmap
          key: config
          optional: true
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 32Mi
