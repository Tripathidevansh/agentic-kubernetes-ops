apiVersion: v1
kind: Pod
metadata:
  name: liveness-probe-failure
  namespace: k8s-agent-demo
  labels:
    app: liveness-probe-failure
spec:
  containers:
  - name: app
    image: busybox:1.36
    command:
    - sh
    - -c
    - sleep 3600
    livenessProbe:
      exec:
        command:
        - sh
        - -c
        - 'true'
      initialDelaySeconds: 3
      periodSeconds: 5
      failureThreshold: 1
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 32Mi
