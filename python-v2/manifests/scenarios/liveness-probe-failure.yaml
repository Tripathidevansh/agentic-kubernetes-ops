# Scenario 6: Liveness Probe Failure
# Intended Failure:
#   The container starts normally, but the exec liveness probe checks for a non-existent
#   file (/tmp/healthy). Upon consecutive probe failures, the kubelet kills and restarts the container.
# Expected Kubernetes Evidence:
#   - Container state: initially Running, transitions to restarts (restartCount increments: 1, 2, 3...).
#   - Container lastState: Terminated (exit code 137 or Error).
#   - Kubelet Warning Event: Reason="Unhealthy", Message="Liveness probe failed: cat: can't open '/tmp/healthy': No such file or directory".
#   - Kubelet Event: Reason="Killing", Message="Container app failed liveness probe, will be restarted".

apiVersion: v1
kind: Pod
metadata:
  name: liveness-probe-failure
  namespace: k8s-agent-demo
  labels:
    app: liveness-probe-failure
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      livenessProbe:
        exec:
          command:
            - cat
            - /tmp/healthy
        initialDelaySeconds: 3
        periodSeconds: 5
        failureThreshold: 1
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "50m"
          memory: "32Mi"
