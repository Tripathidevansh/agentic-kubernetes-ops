# Scenario 8: Missing Secret Reference
# Intended Failure:
#   The Pod requests a sensitive environment variable from a Secret ('nonexistent-secret')
#   that does not exist in the namespace. No real secrets or credentials are created.
# Expected Kubernetes Evidence:
#   - Container state: Waiting (reason="CreateContainerConfigError").
#   - Waiting message: "secret \"nonexistent-secret\" not found".
#   - Pod phase: Pending.
#   - Kubelet Warning Event: Reason="Failed", Message="Error: secret \"nonexistent-secret\" not found".

apiVersion: v1
kind: Pod
metadata:
  name: missing-secret
  namespace: k8s-agent-demo
  labels:
    app: missing-secret
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo Secret: $DB_PASSWORD; sleep 3600"]
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nonexistent-secret
              key: password
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "50m"
          memory: "32Mi"
