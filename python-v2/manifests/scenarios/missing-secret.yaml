apiVersion: v1
kind: Pod
metadata:
  name: missing-secret
  namespace: k8s-agent-demo
  labels:
    app: missing-secret
spec:
  containers:
  - name: app
    image: busybox:1.36
    command:
    - sh
    - -c
    - 'echo Secret: $DB_PASSWORD; sleep 3600'
    env:
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: nonexistent-secret
          key: password
          optional: true
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 32Mi
