apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-test
  namespace: k8s-agent-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-test
  template:
    metadata:
      labels:
        app: oom-test
    spec:
      containers:
      - name: app
        image: python:3.12-alpine
        command:
        - python
        - -c
        - "data = []\nwhile True:\n    data.append(\"x\" * 1024 * 1024)\n"
        resources:
          limits:
            memory: 256Mi
          requests:
            memory: 128Mi
